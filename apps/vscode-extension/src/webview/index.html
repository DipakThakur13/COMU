<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Webview Security: Strict CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' vscode-resource:; script-src 'unsafe-inline' vscode-resource:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMU AI Software Engineer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-view">
        <div class="header">
            <div class="header-left">
                <span class="logo">✦ COMU</span>
                <span class="subtitle">AI Software Engineer</span>
            </div>
            <div class="header-right">
                <div class="status-indicator">
                    <span id="runtime-status-dot" class="dot offline"></span>
                    <span id="runtime-status-text">Offline</span>
                </div>
                <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
            </div>
        </div>

        <div id="chat-container" class="chat-container">
            <!-- Dynamic chat goes here -->
            <div class="empty-state">
                <div class="empty-logo">✦</div>
                <h1>COMU</h1>
                <h2>AI Software Engineer</h2>
                <p>Build, debug, refactor and understand your codebase.</p>
                <div class="action-chips">
                    <button class="chip" data-prompt="Implement a feature ">✨ Implement a feature</button>
                    <button class="chip" data-prompt="Fix a bug in ">🐛 Fix a bug</button>
                    <button class="chip" data-prompt="Add tests for ">🧪 Add tests</button>
                    <button class="chip" data-prompt="Explain this project">🔍 Explain this project</button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="composer-container">
                <textarea id="prompt-input" placeholder="Ask COMU... (Shift+Enter for newline)" rows="1"></textarea>
                <div class="composer-actions">
                    <button id="cancel-btn" class="cancel-btn" style="display: none;">■ Stop</button>
                    <button id="submit-btn" class="submit-btn" title="Send (Enter)">➤</button>
                </div>
            </div>
            <div class="model-selector-container">
                <span>Model:</span>
                <select id="model-select">
                    <option value="" disabled selected>Loading models...</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Settings View -->
    <div id="settings-view" style="display: none;">
        <div class="header">
            <div class="header-left">
                <button id="back-btn" class="icon-btn">←</button>
                <span class="logo">COMU Settings</span>
            </div>
        </div>
        <div class="settings-content" id="providers-container">
            <!-- Dynamic providers go here -->
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>

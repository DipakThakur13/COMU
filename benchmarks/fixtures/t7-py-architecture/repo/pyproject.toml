[project]
name = "permits"
version = "3.1.0"
description = "Building permit applications, reviews and decisions."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
permits = "permits.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
